:"#FCE6EE",color:"ชมพูพาสเทล",hex:"#F5A9BE",item:"ถ้วยน้ำใบโปรด",stats:[65,95,50],up:{key:"ตากลมโตเปิดรับรัก",what:"น้องเอียงหัวมองด้วยตากลมโต อ่อนไหวและน่ารักจนใครเห็นก็ต้องละลาย",mean:"หมายความว่าน้องเปิดรับความรักและมิตรภาพใหม่ๆ ได้ง่ายมากช่วงนี้"},rv:{key:"งอนง่ายกว่าปกติ",what:"อารมณ์อ่อนไหวเกินไปจนงอนง่ายกว่าปกติ นิดหน่อยก็อาจน้อยใจ",mean:"หมายความว่าน้องต้องการความอ่อนโยนและความเข้าใจมากเป็นพิเศษตอนนี้"}},cups12:{th:"ไพ่อัศวินถ้วย",en:"Knight of Cups",group:"cups",bg:"#FCE6EE",color:"ชมพูพาสเทล",hex:"#F5A9BE",item:"ถ้วยน้ำใบโปรด",stats:[65,95,50],up:{key:"นักฝันโรแมนติก",what:"น้องเดินตามกลิ่นและเสียงเรียกด้วยหัวใจโรแมนติก ตามหาความผูกพันด้วยความอ่อนโยนไม่รีบร้อน",mean:"หมายความว่าน้องเป็นนักฝันตัวน้อยที่น่ารักที่สุด"},rv:{key:"ฝันไกลเกินจริง",what:"ความเพ้อฝันเริ่มพาไปไกลเกินจริง หรือความผิดหวังจากความรักที่ไม่ได้ดั่งใจทำให้ซึมไปสักพัก",mean:"หมายความว่าน้องต้องการเวลาปรับใจก่อน"}},cups13:{th:"ไพ่ราชินีถ้วย",en:"Queen of Cups",group:"cups",bg:"#FCE6EE",color:"ชมพูพาสเทล",hex:"#F5A9BE",item:"ถ้วยน้ำใบโปรด",stats:[65,95,50],up:{key:"เพื่อนที่เข้าใจหัวใจ",what:"น้องเข้าไปนั่งเคียงข้างและปลอบโยนทันทีที่คุณรู้สึกเศร้า",mean:"หมายความว่าสัญชาตญาณด้านความรู้สึกของน้องไวมากจนน่าทึ่ง เป็นเพื่อนที่เข้าใจหัวใจได้ดีที่สุด"},rv:{key:"อ่อนไหวจนควบคุมยาก",what:"อารมณ์อ่อนไหวจนควบคุมตัวเองไม่ค่อยได้ อาจซึมเศร้าหรือวิตกกังวลง่ายกว่าปกติ",mean:"หมายความว่าน้องต้องการพื้นที่ปลอดภัยและความมั่นคงทางใจมากขึ้น"}},cups14:{th:"ไพ่ราชาถ้วย",en:"King of Cups",group:"cups",bg:"#FCE6EE",color:"ชมพูพาสเทล",hex:"#F5A9BE",item:"ถ้วยน้ำใบโปรด",stats:[65,95,50],up:{key:"ใจเย็นมั่นคง",what:"ไม่ว่าจะเจอสถานการณ์กดดันแค่ไหน น้องก็ยังนิ่งสงบและควบคุมอารมณ์ตัวเองได้ดี",mean:"หมายความว่าความใจเย็นแบบนี้ทำให้ทุกคนรอบตัวอุ่นใจไปด้วย"},rv:{key:"เก็บกดความรู้สึก",what:"น้องเก็บกดความรู้สึกไว้ข้างในโดยไม่แสดงออกตรงๆ แต่ระบายผ่านพฤติกรรมแปลกๆ แทน",mean:"หมายความว่าอาจต้องสังเกตอาการอย่างเลียตัวบ่อยผิดปกติหรือกินไม่เป็นเวลา"}},swords1:{th:"ไพ่เอซดาบ",en:"Ace of Swords",group:"swords",bg:"#E2EEFA",color:"
